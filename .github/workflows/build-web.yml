name: Build and Deploy Web Game

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.3-stable
          export-templates: true

      - name: Check Godot Web Templates
        run: |
          godot --version
          echo "Checking export templates..."
          ls -lah ~/.local/share/godot/export_templates/4.3.stable/
          test -f ~/.local/share/godot/export_templates/4.3.stable/web_release.zip
          test -f ~/.local/share/godot/export_templates/4.3.stable/web_debug.zip
          
      - name: Check scene file
        run: |
          ls -la scenes
          test -f scenes/Main.tscn

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build Godot Web
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          echo "Checking exported files..."
          ls -lah build/web
          test -s build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
